name: NeoTasks full application
on:
  push:
    branches: [main]
    paths: ['**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEOTASKS_TEST_DATABASE: Host=localhost;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare versioned PostgreSQL schema
        run: |
          dotnet restore NeoTasks.Api
          dotnet tool install dotnet-ef --tool-path /tmp/ef --version 10.0.12
          /tmp/ef/dotnet-ef migrations has-pending-model-changes --project NeoTasks.Api
          mkdir -p schema
          cp NeoTasks.Api/Migrations/*.cs schema/
      - name: Test API boundaries and frontend contract
        run: dotnet test NeoTasks.Tests --configuration Release --logger trx
      - name: Build and start the complete application
        run: docker compose -f compose.yaml up --build -d --wait --wait-timeout 180
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies on the runner
        working-directory: frontend
        run: npm ci
      - name: Install Chromium on the runner
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise the interface and persistent database
        working-directory: frontend
        run: npm run test:e2e
      - name: Container diagnostics
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neotasks-verification
          path: |
            schema/
            frontend/captures/
            NeoTasks.Tests/TestResults/
            frontend/playwright-report/
            frontend/test-results/
      - name: Stop runner containers
        if: always()
        run: docker compose -f compose.yaml down
